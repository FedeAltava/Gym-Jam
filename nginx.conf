server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — strips /api prefix before forwarding
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Rewrite Set-Cookie path so the browser sends the cookie on /api/auth/* requests.
        # Backend sets Path=/auth; the browser sees /api/auth/* URLs, so without this
        # rewrite the cookie is never sent back on refresh/logout calls.
        proxy_cookie_path /auth /api/auth;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
