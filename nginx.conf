server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — strips /api prefix before forwarding
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Rewrite Set-Cookie path so the browser sends the cookie on /api/auth/* requests.
        # Backend sets Path=/auth; the browser sees /api/auth/* URLs, so without this
        # rewrite the cookie is never sent back on refresh/logout calls.
        proxy_cookie_path /auth /api/auth;
    }

    # Service worker must never be cached — browsers check it on every load
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Web manifest — short cache so installs pick up name/icon changes quickly
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite-hashed assets (js/css/fonts/images) — safe to cache forever
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
